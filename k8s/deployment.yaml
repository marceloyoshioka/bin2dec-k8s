apiVersion: apps/v1
kind: Deployment
metadata:
  name: bin2dec-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bin2dec-app
  template:
    metadata:
      labels:
        app: bin2dec-app
    spec:
      containers:
        - name: bin2dec-container
          image: petersonmarcelo/bin2dec-api:v1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - configMapRef:
                name: bin2dec-config